# Catálogo de skills, comandos y agentes disponibles para ejecutar el plan.
# Inventario hecho el 2026-10-01 sobre esta máquina y la cuenta de claude.ai.
# `herramientas/regenerar.py` valida que cada HU solo recomiende entradas de este catálogo
# y genera con él la tabla de la guía de ejecución.
#
# tipo:   skill | comando | agente
# origen: proyecto (solvershub-backend/.claude) | plugin <nombre> | usuario (~/.claude/skills)
#         | claude.ai | integrada
# estado: ok | desactualizada (se corrige en la Semana 0 de la guía)

# ---------------------------------------------------------------- proyecto: skills
adr:
  tipo: skill
  origen: proyecto
  estado: ok
  uso: Registrar una decisión de arquitectura como ADR numerado en docs/adr
agentcore-conventions:
  tipo: skill
  origen: proyecto
  estado: ok
  uso: "Dónde va cada cosa (core, pack, configuración, artefacto del tenant), límites de capa y nombres reales del repo Python"
db-migration:
  tipo: skill
  origen: proyecto
  estado: ok
  uso: "Crear o revisar migraciones Alembic (core y packs) con tenant_id, RLS forzada, policy con nullif y tablas de sistema"
desplegar-test-agent-core:
  tipo: skill
  origen: proyecto
  estado: ok
  uso: "Mergear a develop, desplegar en el Coolify de test (app tr0vpdei…) y verificar salud; nunca toca producción"
eval-author:
  tipo: skill
  origen: proyecto
  estado: ok
  uso: Crear o ampliar golden sets por tenant o del framework
incident:
  tipo: skill
  origen: proyecto
  estado: ok
  uso: Runbook de triage cuando el agente no responde o responde mal
meta-whatsapp:
  tipo: skill
  origen: proyecto
  estado: ok
  uso: "Conocimiento vigente de WhatsApp/Meta: Embedded Signup, plantillas, ventana de 24 h, precios 2026, firma del webhook y BYOK"
pagos-wompi:
  tipo: skill
  origen: proyecto
  estado: ok
  uso: "Conocimiento vigente de Wompi: firma de integridad, checksum de eventos, sandbox/producción, mínimos y conciliación"
new-pack:
  tipo: skill
  origen: proyecto
  estado: ok
  uso: Crear un pack vertical nuevo con su estructura Python, Alembic y flow
new-tool:
  tipo: skill
  origen: proyecto
  estado: ok
  uso: "Crear una MCPTool en un pack: schema, handler con errores como resultado, flow.json, tests cross-tenant y eval"
onboard-tenant:
  tipo: skill
  origen: proyecto
  estado: ok
  uso: "Dar de alta un cliente con el CLI real (tenant create/seed), TENANTS_ROOT, BYOK, evals por tenant y publicación"
release:
  tipo: skill
  origen: proyecto
  estado: ok
  uso: "Release develop → main: gates de CI, auditor, evals, migraciones, OpenAPI, CHANGELOG, deploy de producción, tag y rollback"


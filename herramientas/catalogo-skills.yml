eval-runner:
  tipo: agente
  origen: proyecto
  estado: ok
  uso: Correr el golden set contra un candidato y reportar regresiones
migrator:
  tipo: agente
  origen: proyecto
  estado: ok
  uso: Migrar datos externos (CSV, BD, API) a las entidades de los packs
optimizer:
  tipo: agente
  origen: proyecto
  estado: ok
  uso: Optimizar costo de LLM y precisión de las tools
plugin-dev:
  tipo: agente
  origen: proyecto
  estado: ok
  uso: Generar un plugin o pack desde cero


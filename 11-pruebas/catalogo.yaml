# Catálogo de pruebas y validaciones de SolversHub (ver README.md de esta carpeta).
# Se versiona con git: cada HU que agregue o cambie comportamiento actualiza este archivo en su PR.
version: 11
fecha: '2026-10-20'
fuente: Artifact «Camino a producción» (https://claude.ai/artifact/P2spcrvuTNGZXf2xEEqgLn)
items:
- id: pruebas-ir-a-una-seccion-con-ctrl-k
  seccion: pruebas
  modulo: Panel
  entorno: panel
  area: Navegación y sesión
  grupo: Panel · navegación y paleta (SPEC-29)
  titulo: Ir a una sección con Ctrl+K
  prioridad: P0
  plataforma: panel
  resumen: Ctrl+K → «prom» → Enter
  pasos:
  - En test, pulsar Ctrl+K desde cualquier página.
  - Escribir «prom».
  - Enter.
  esperado: Llega a Cobranza › Promesas; el foco vuelve a donde estaba al cerrar.
  quien: Dueño
  hu:
  - HU-DS-05

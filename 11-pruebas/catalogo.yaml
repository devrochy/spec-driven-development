  - HU-AOS-23
- id: pruebas-conexiones-pausa-chat-web-aviso
  seccion: pruebas
  modulo: Asistente y WhatsApp
  entorno: web
  area: Chat web
  grupo: Consola de conexiones
  titulo: Pausar el chat web y ver el aviso en la ventana del chat
  contexto: 'Para qué sirve: comprobar que el chat web se pausa desde Conexiones igual que las demás conexiones, que
    quien abre el chat ve que está en pausa y no puede escribir, y que la pausa es el mismo interruptor de
    Configuración › Chat web: si se cambia en un lado, el otro lo refleja.'
  prioridad: P1
  plataforma:
  - panel
  - web
  precondiciones:
  - Estar dentro del horario de atención del negocio (o sin horario configurado)
  - 'Los avisos de la ventana del chat llegan con el cambio de la landing (landing#14). Si en su lugar ves solo «Chat
    no disponible.», la landing de test todavía no lo tiene: anótalo en la nota del paso.'
  requiere:
  - datos-mis-datos-de-prueba
  - datos-negocio-con-agentes
  pasos:
  - accion: En una ventana privada nueva, abre el chat web de tu negocio (el enlace está en Plataforma › Pruebas › Datos
      de prueba) y escribe «Hola». Deja esa ventana abierta.
    esperado: El asistente responde.
  - accion: Con tu dueño de prueba, abre Conexiones, busca la tarjeta del chat web y pulsa «Pausar».
    esperado: 'Se abre la confirmación «Pausar conexión»: dice que el chat web deja de responder, que quien abra el chat
      verá que está en pausa y no podrá escribir hasta que lo reanudes, que es el mismo interruptor de Configuración →
      Chat web, y termina con «Pausa solo este canal; los demás canales del negocio siguen atendiendo.»'
  - accion: Pulsa «Pausar» en la confirmación.
    esperado: Aparece el aviso «Conexión pausada.»; la tarjeta del chat web queda en «Pausada» y el botón cambia a
      «Reanudar».
  - accion: Abre Configuración › Chat web.
    esperado: El interruptor «Activar chat web» está apagado.
  - accion: Vuelve a la ventana privada que dejaste abierta y escribe «¿Están atendiendo?».
    esperado: 'El mensaje no se envía: la ventana muestra «Este chat está en pausa por ahora y no recibe mensajes. Vuelve
      más tarde o escríbenos por otro canal.» y lo que escribiste queda en la caja de texto. El asistente no responde.'
  - accion: Recarga la ventana privada (o abre el enlace en una ventana privada nueva).
    esperado: En lugar del chat aparece «Este chat no está disponible en este momento. Vuelve más tarde o escríbenos por
      otro canal.»
  - accion: Con tu dueño de prueba, abre Configuración › Chat web, enciende «Activar chat web» y guarda.
    esperado: Se guarda sin error.
  - accion: Abre Conexiones y busca la tarjeta del chat web.
    esperado: La tarjeta ya no dice «Pausada» y el botón vuelve a «Pausar».
  - accion: Cierra las ventanas privadas, abre el enlace del chat web en una nueva y escribe «Hola».
    esperado: El asistente vuelve a responder. Deja el chat web encendido; las demás pruebas del chat web lo necesitan.
  quien: Tester
  hu:
  - HU-AOS-23

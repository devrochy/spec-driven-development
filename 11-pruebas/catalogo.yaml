- id: pruebas-seguridad-tenant-ajeno-y-escritura-sin-permiso
  seccion: pruebas
  modulo: Plataforma
  entorno: api
  area: Seguridad
  grupo: Seguridad
  titulo: Otro negocio y escritura sin permiso responden 403
  contexto: 'Para qué sirve: comprobar que la API rechaza pedir datos de un negocio ajeno y escribir con permiso de solo lectura,
    y que los secretos de una habilidad nunca salen en claro. Es técnica (llamadas directas a la API): la corre Claude, no
    los testers.'
  prioridad: P0
  plataforma:
  - api
  datos:
  - El dueño y el colaborador de prueba de un tester (Plataforma › Pruebas › Datos de prueba); el colaborador con Clientes
    en solo lectura (se cambia en Cuenta › Equipo)
  requiere:
  - datos-mis-datos-de-prueba
  pasos:

- id: pruebas-panel-iniciar-y-cerrar-sesion
  seccion: pruebas
  modulo: Panel
  entorno: panel
  area: Navegación y sesión
  grupo: Sesión y navegación
  titulo: Iniciar y cerrar sesión
  contexto: El login del panel crea una sesión en una cookie protegida; sin sesión, las páginas piden entrar.
  prioridad: P0
  plataforma: panel
  datos:
  - Tu dueño de prueba (Pruebas › Datos de prueba)
  requiere:
  - datos-mis-datos-de-prueba
  pasos:
  - accion: En una ventana privada abrir https://test.solvershub.site/conversaciones.
    esperado: Redirige al login.
  - accion: Entrar con una contraseña incorrecta.
    esperado: Error legible; no entra.
  - accion: Entrar con la correcta.
    esperado: Llega al Resumen con el usuario y el negocio en la barra superior.
  - accion: En DevTools › Application › Cookies, mirar panel_session.
    esperado: Es HttpOnly y SameSite=Lax; el token no aparece en el HTML.
  - accion: Pulsar Salir y volver a abrir /conversaciones.
    esperado: Vuelve al login.
  quien: Tester
  origen:
  - PLAN-DE-PRUEBAS:AUTH-01
  - PLAN-DE-PRUEBAS:AUTH-02
  - PLAN-DE-PRUEBAS:AUTH-03
  - PLAN-DE-PRUEBAS:AUTH-04
  - PLAN-DE-PRUEBAS:AUTH-06

- id: pruebas-agentes-costo-oculto-sin-permiso
  seccion: pruebas
  modulo: Panel
  entorno: panel
  area: Agentes
  grupo: Agentes
  titulo: Sin permiso de Costos no se ve el dinero
  contexto: 'Para qué sirve: comprobar que un colaborador sin acceso a Costos ve cuánto trabajó cada agente pero no
    cuánto costó.'
  prioridad: P1
  plataforma: panel
  requiere:
  - datos-mis-datos-de-prueba
  - datos-negocio-con-agentes
  pasos:
  - accion: Con tu dueño de prueba, abre Agentes y luego Ventas › Consumo y calidad.
    esperado: Las tarjetas muestran Costo, y en Consumo y calidad aparece el cuadro «Costo del período».
  - accion: 'Ve a Colaboradores, abre a tu colaborador de prueba y, en «Otorgar permiso», elige Sección «Costos LLM» y
      Acceso «Sin acceso». Pulsa Otorgar. (Si en su menú no aparece Agentes, otórgale también «Agentes» con Acceso
      «Lectura».)'
    esperado: Aparece el aviso «Permiso otorgado.».
  - accion: En otro navegador, entra con tu colaborador de prueba y abre Agentes.
    esperado: Las tarjetas muestran Conversaciones y Turnos, pero no Costo. No aparece el botón «Nuevo agente».
  - accion: Abre Ventas y mira las pestañas Conversaciones y Consumo y calidad.
    esperado: 'En Conversaciones no hay columna Costo. En Consumo y calidad se ven Turnos atendidos y Tokens (la medida
      de texto que usa la IA), sin «Costo del período». Tampoco aparece el botón «Editar agente».'
  - accion: Al terminar, con tu dueño de prueba, vuelve a darle «Costos LLM» con Acceso «Lectura» al colaborador.
    esperado: El colaborador vuelve a ver el costo al recargar Agentes.

- id: pruebas-onboarding-alta-con-preset-restaurante
  seccion: pruebas
  modulo: Plataforma
  entorno: api
  area: Operación
  grupo: Alta de negocios y primeros pasos
  titulo: Alta de un negocio con el preset Restaurante
  contexto: 'Para qué sirve: comprobar que un preset deja el negocio listo (comercio y pagos habilitados, catálogo de ejemplo
    y flujo compuesto) sin fallar si faltan claves, y que aplicarlo otra vez no duplica nada (HU-FWK-03). Se hace con la línea
    de comandos del servidor: la corre Claude, no los testers.'
  prioridad: P2
  plataforma:
  - api
  - panel
  pasos:
  - accion: 'En el contenedor del worker de test: agent-core tenant create -y --name ''QA Restaurante'' --slug qa-restaurante
      --preset restaurante'
    esperado: Termina sin error y lista los pasos aplicados.
  - accion: Entrar al panel como master y seleccionar QA Restaurante.
    esperado: Ventas › Productos tiene productos de ejemplo; Pagos en línea aparece «pendiente de configurar».
  - accion: Correr dos veces agent-core tenant aplicar-preset qa-restaurante restaurante --con-ejemplos.
    esperado: No duplica productos, categorías ni secciones.
  quien: Claude
  hu:
  - HU-FWK-03
- id: pruebas-0a-interruptor-y-cola-de-altas
  seccion: pruebas
  modulo: Plataforma
  entorno: panel
  area: Negocios
  grupo: Antiabuso y cumplimiento del alta (0A)
  titulo: Pausar el alta automática y resolver la cola
  contexto: 'Para qué sirve: comprobar que el dueño de la plataforma puede pausar el alta automática de negocios que vende
    el asistente de SolversHub y resolver a mano las compras que quedan en espera (guía 0A § 9, HU-SH-07). Es configuración
    del asistente de ventas de SolversHub, no del framework: solo la ve el master en Plataforma › Negocios › Alta automática,
    y los testers no la corren.'
  prioridad: P1
  plataforma:
  - panel
  - whatsapp
  precondiciones:
  - Sesión de master (no de tester)
  - Un celular autorizado para escribir al WhatsApp de SolversHub en test
  datos:
  - Un correo con alias nuevo por cada compra
  - Tarjeta de prueba de Wompi sandbox; el mínimo por link es 150.000 COP
  requiere:
  - datos-wompi-sandbox
  - datos-celular-whatsapp
  - datos-negocio-ficticio
  - datos-correo-alias
  pasos:
  - accion: Como master, abre Plataforma › Negocios › Alta automática, pausa el alta y escribe un motivo.
    esperado: La página dice que el alta automática está pausada y muestra el motivo.
  - accion: Desde tu celular, compra un plan pagado al asistente de SolversHub por WhatsApp y paga con la tarjeta de prueba.
    esperado: El asistente confirma el pago y avisa que el alta queda en revisión; todavía no llega el correo de acceso.
  - accion: En Alta automática, abre la cola y aprueba esa compra.
    esperado: Pasa a «en curso» y en menos de un minuto el negocio nuevo aparece en Plataforma › Negocios. Aprobarla otra
      vez no crea otro negocio.
  - accion: Haz otra compra, descártala desde la cola y reanuda el alta automática.
    esperado: La compra descartada no crea negocio y la página vuelve a decir que el alta automática está activa.
  quien: Dueño
  hu:
  - HU-SH-07
  origen:
  - guia-0A:§9

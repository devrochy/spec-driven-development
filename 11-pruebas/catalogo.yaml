- id: pruebas-0a-usuario-sin-contexto
  seccion: pruebas
  modulo: Plataforma
  entorno: panel
  area: Primeros pasos
  grupo: Alta automática de negocios (0A)
  titulo: Un usuario sin contexto activa su negocio solo
  contexto: 'Prueba moderada: alguien que no conoce SolversHub entra con su correo y deja el asistente listo sin
    ayuda en menos de 15 minutos (guía 0A § 8, HU-SH-06).'
  prioridad: P1
  plataforma:
  - correo
  - panel
  precondiciones:
  - Un negocio recién creado con su correo de invitación
  - Una persona que no conozca SolversHub
  pasos:
  - accion: 'Pedirle: «Te llegó este correo. Entra a tu negocio».'
    esperado: Llega al Resumen (anotar el tiempo y si dudó con la contraseña).
  - accion: Preguntarle «¿Qué te falta para que tu asistente atienda?».
    esperado: Lo lee en los primeros pasos sin ayuda.
  - accion: Pedirle que describa su negocio y pruebe el asistente.
    esperado: Vuelve al Resumen y ve los pasos marcados.
  - accion: Preguntar qué fue lo más confuso.
    esperado: Anotar textos no entendidos y dónde se perdió.
  esperado: Llega al Resumen y completa los pasos 1, 2 y 3 sin ayuda en menos de 15 minutos.

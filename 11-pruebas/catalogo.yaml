- id: pruebas-panel-confirmacion-con-consecuencia
  seccion: pruebas
  modulo: Panel
  entorno: panel
  area: Formularios y avisos
  grupo: Formularios, avisos y confirmaciones
  titulo: Las acciones destructivas piden confirmación con su consecuencia
  contexto: Desactivar un colaborador, resolver una conversación, eliminar una conexión o cancelar una cita piden
    confirmación que explica qué pasa, con el botón en rojo (HU-UI-02).
  prioridad: P1
  plataforma: panel
  precondiciones:
  - Sesión iniciada en https://test.solvershub.site con tu negocio de prueba seleccionado
  - Un colaborador de prueba creado para esto
  datos:
  - Tu dueño de prueba (Pruebas › Datos de prueba)
  requiere:
  - datos-mis-datos-de-prueba
  pasos:
  - accion: En Colaboradores, abrir Acciones del colaborador de prueba y elegir Desactivar.
    esperado: Se abre una confirmación que dice que no podrá entrar, con el botón de confirmar en rojo.
  - accion: Pulsar Cancelar.
    esperado: No cambia nada y el foco vuelve al botón Acciones.
  - accion: Repetir y confirmar.
    esperado: El colaborador queda Inactivo y aparece un aviso de éxito.
  quien: Tester
  hu:
  - HU-UI-02
- id: pruebas-panel-guardar-en-el-negocio-seleccionado
  seccion: pruebas
  modulo: Panel
  entorno: panel
  area: Formularios y avisos
  grupo: Formularios, avisos y confirmaciones
  titulo: Lo que se guarda va al negocio seleccionado
  contexto: Con varios negocios, un cambio se guarda en el negocio activo del selector, no en otro (HU-UI-01).
  prioridad: P0
  plataforma: panel
  precondiciones:
  - Sesión de tester con tu negocio de prueba y otro negocio de test con Cobranza (por ejemplo, Cobranza Demo Norte)
  datos:
  - Tu cuenta de tester (actúa como master)
  requiere:
  - datos-cuenta-tester
  - datos-mis-datos-de-prueba
  pasos:
  - accion: Seleccionar tu negocio de prueba en el selector de negocio.
    esperado: La barra superior muestra tu negocio de prueba.
  - accion: En Habilidades › Cobranza › Configurar, cambiar un valor (por ejemplo, días de gracia) y guardar.
    esperado: Aviso de éxito.
  - accion: Cambiar al otro negocio y abrir la misma configuración, sin cambiar nada.
    esperado: 'El otro negocio conserva su valor: el cambio quedó solo en tu negocio de prueba.'
  - accion: Volver a tu negocio de prueba y devolver el valor original.
    esperado: Queda como estaba.

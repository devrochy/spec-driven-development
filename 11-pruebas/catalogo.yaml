- id: datos-mis-datos-de-prueba
  seccion: datos
  grupo: Cuentas y negocio
  titulo: Tu negocio y tus cuentas de prueba
  resumen: 'Un negocio «QA · …» propio con Comercio, Agenda y Cobranza, y tres cuentas: dueño, gestor y colaborador.'
  porque: Las pruebas que dicen «tu dueño de prueba», «tu gestor de prueba», «tu colaborador de prueba» o «tu negocio
    de prueba» usan estas cuentas. Cada tester tiene las suyas, así nadie pisa los datos de otro.
  como: 'En Pruebas › Datos de prueba pulsa «Preparar mis datos». Copia las contraseñas en ese momento: se muestran
    una sola vez. Si las pierdes, pulsa «Contraseñas nuevas». Las cuentas usan el dominio pruebas.solvershub.test
    y no reciben correo: para las pruebas de correo crea un colaborador con tu correo con alias.'
- id: datos-negocio-con-agentes
  seccion: datos
  grupo: Cuentas y negocio
  titulo: Tu negocio de prueba con agentes
  resumen: 'Tu negocio de prueba atiende con varios agentes (General, Ventas y Agenda), tiene su propio chat web y una
    agenda de lunes a viernes de 9 a 19 y sábados de 9 a 13.'
  porque: 'Las pruebas de Agentes, de la consola de Conexiones y del chat web necesitan un negocio donde no responde
    un solo asistente sino un equipo: el Coordinador lee cada mensaje y se lo pasa al agente que sabe de eso (Ventas
    vende y cobra, Agenda agenda citas y el General saluda y responde lo demás). El chat web es una página donde
    escribes como si fueras un cliente del negocio, sin celular ni WhatsApp.'
  como: 'En Plataforma › Pruebas › Datos de prueba pulsa «Actualizar mis datos» (si nunca preparaste tus datos, el
    botón dice «Preparar mis datos»). Actualizar no muestra contraseñas nuevas ni borra lo que creaste (por ejemplo, un
    agente Cobranza hecho por ti): deja tu negocio con los agentes General (el que responde por defecto), Ventas y
    Agenda, el Coordinador en el chat web y el reparto de mensajes encendido. En esa misma pestaña aparecen el enlace
    del chat web y la lista de tus agentes. Para escribir como un cliente nuevo, abre el enlace en una
    ventana privada (Ctrl+Shift+N en Chrome); para empezar otra conversación, cierra todas las ventanas privadas y
    abre una nueva. Consejo: deja tu cuenta de tester en una ventana normal (ahí registras los resultados) y entra
    con tu dueño de prueba en otro navegador. Ojo con el horario: el asistente solo contesta dentro del horario de
    atención del negocio (Configuración › Horario de atención). Si en una prueba anterior configuraste un horario,
    escribe dentro de ese horario o quítalo antes de probar el chat web. Fuera de horario, el asistente solo responde
    el mensaje de fuera de horario, o un mensaje por defecto si ese campo está vacío (este último cambio está en
    camino).'
- id: datos-cuenta-tester
  seccion: datos
  grupo: Cuentas y negocio
  titulo: Tu cuenta de tester
  resumen: La cuenta con la que entras al panel de test. Actúa como master en la operación.
  porque: Las pruebas de Negocios, Conexiones, App de Meta, Pruebas y las del asistente de ventas de SolversHub
    se hacen con tu cuenta de tester.
  como: 'Entra a https://test.solvershub.site con la cuenta de tu invitación. Con el selector de negocio de arriba
    eliges dónde pruebas: tu negocio de prueba, o SolversHub para las pruebas de su asistente. Los demás negocios
    de test son del equipo: míralos, pero no cambies su configuración.'
- id: datos-cartera-de-ejemplo
  seccion: datos
  grupo: Cuentas y negocio
  titulo: Clientes de ejemplo de la cartera
  resumen: Cartera Centro, asignada a tu gestor, con caja de 3.000.000 y cuatro clientes.
  porque: Las pruebas de Cobranza y de la app de campo necesitan clientes al día, en mora y sin préstamo.
  como: 'Vienen con tus datos de prueba: Juana Pérez en mora (préstamo diario con 9 cuotas atrasadas), Carlos Ruiz
    al día, Pedro Gómez con un préstamo semanal recién otorgado y Ana Gómez sin préstamo. No tienen teléfono: para
    probar mensajes, edita el teléfono de un cliente y pon tu celular autorizado.'
- id: datos-celular-android
  seccion: datos
  grupo: Dispositivos
  titulo: Un celular Android con la APK de test
  resumen: La app de SolversHub instalada desde la build de test.
  porque: 'Las pruebas del entorno APK se hacen en el celular: la app del dueño y la app de campo del gestor.'
  como: Instala la APK de test con el enlace que te comparte el dueño de la plataforma (permite instalar apps de
    origen desconocido). Entra con tu dueño o tu gestor de prueba. Las actualizaciones llegan solas por OTA al reabrir
    la app.
- id: datos-celular-whatsapp
  seccion: datos
  grupo: Dispositivos
  titulo: Un celular autorizado para el WhatsApp de test
  resumen: Tu número de WhatsApp agregado como destinatario de prueba en la App de Meta de test.
  porque: 'El número de WhatsApp de test todavía no está verificado en Meta: solo conversa con los celulares que
    están en su lista de destinatarios de prueba.'
  como: Pide al dueño de la plataforma que agregue tu número en la App de Meta de test (WhatsApp › Configuración
    de la API › destinatarios). Después escribe al número de test que aparece en Conexiones.
- id: datos-whatsapp-qr
  seccion: datos
  grupo: Dispositivos
  titulo: Un WhatsApp vinculado por QR y otro teléfono para escribirle
  resumen: Un número de repuesto vinculado por QR a tu negocio de prueba (Conexiones › WhatsApp Web) y otro teléfono
    con WhatsApp para escribirle como cliente.
  porque: 'Las pruebas de pausar y reanudar una conexión necesitan un canal de WhatsApp que se pueda pausar desde
    Conexiones. El vinculado por QR (WhatsApp Web) es el que puedes conectar tú mismo, sin Meta ni lista de
    destinatarios. Si no hay un número vinculado, esas pruebas quedan Bloqueadas.'
  como: 'Usa un número de repuesto, nunca tu WhatsApp principal: el canal no es oficial y WhatsApp puede bloquear el
    número. Con tu dueño de prueba abre Conexiones › WhatsApp Web, pulsa «Acepto el riesgo» y, en el teléfono de
    repuesto, abre WhatsApp › Dispositivos vinculados › Vincular un dispositivo y escanea el QR (se renueva cada
    pocos segundos; si vence, escanea el nuevo). Queda vinculado cuando la página muestra el número. Vuelve a
    Conexiones: aparece la tarjeta de WhatsApp Web con ese número. Para escribirle usa otro teléfono cualquiera con
    WhatsApp (no hace falta agregarlo en Meta). Si el QR no aparece, el conector de WhatsApp Web de test está caído:
    avisa al dueño de la plataforma y marca la prueba como Bloqueada. Al terminar puedes desvincularlo desde el
    teléfono de repuesto.'
- id: datos-correo-alias
  seccion: datos
  grupo: Correo
  titulo: Un correo con alias
  resumen: Tu correo con un +alias, por ejemplo tunombre+free1@gmail.com.
  porque: Las altas, invitaciones y recuperaciones de contraseña llegan por correo, y cada alta necesita un correo
    distinto.
  como: 'En Gmail o en Outlook, agrega +algo antes de la arroba: tunombre+free1@gmail.com llega a tu bandeja de
    siempre, pero para SolversHub es otro correo. Usa un alias nuevo por cada alta.'
- id: datos-smtp-prueba
  seccion: datos
  grupo: Correo
  titulo: Un SMTP de prueba
  resumen: Servidor, puerto, usuario y clave de un buzón de prueba.
  porque: La prueba de conexión de correo del panel necesita un SMTP que funcione.
  como: Crea un buzón gratuito de pruebas (por ejemplo, Mailtrap) o usa una contraseña de aplicación de tu Gmail.
    Nunca uses la contraseña real de tu correo.
- id: datos-wompi-sandbox
  seccion: datos
  grupo: Pagos
  titulo: Wompi de prueba (sandbox) y su tarjeta
  resumen: Tus llaves de prueba de Wompi para cobrar en tu negocio de prueba, y la tarjeta 4242 4242 4242 4242 para
    pagar.
  porque: 'Test cobra con Wompi en sandbox: nada se cobra de verdad, pero el pago tiene que ser con datos de prueba.
    Para que tu negocio de prueba mande links de pago, tú mismo le cargas unas llaves de prueba de Wompi: no vienen
    puestas.'
  como: 'Llaves: crea una cuenta gratis en Wompi (comercios.wompi.co) y, en el modo de pruebas (sandbox), busca en la
    sección de desarrolladores la llave pública (empieza por pub_test_), la llave privada (prv_test_) y el secreto
    de eventos. Solo sirven las de prueba: nunca uses llaves que empiecen por pub_prod_ o prv_prod_. Cárgalas en tu
    negocio de prueba en Habilidades › Pagos en línea › Configurar, con «Usar el ambiente de pruebas de Wompi»
    marcado, y pulsa «Guardar y activar». No las pegues en notas, capturas ni mensajes. Tarjeta: en la página de pago
    de Wompi elige tarjeta y usa 4242 4242 4242 4242 (aprobada), cualquier fecha futura y cualquier CVC de 3 dígitos.
    En sandbox el mínimo de un link es 150.000 COP: un monto menor no genera link. Nunca uses una tarjeta real en
    test.'
- id: datos-negocio-ficticio
  seccion: datos
  grupo: Pagos
  titulo: Datos de un negocio ficticio
  resumen: Nombre, tipo de negocio, documento y teléfono inventados para un alta.
  porque: Las pruebas de alta automática piden datos de un negocio y no deben usar los de uno real.
  como: Inventa el nombre (por ejemplo, «Café de Prueba Ana»), usa el documento 900123456 y tu celular autorizado.
    Para cada alta usa un correo con alias distinto.
- id: datos-captura
  seccion: datos
  grupo: Evidencia
  titulo: Capturas de pantalla
  resumen: Cómo adjuntar evidencia a un paso.
  porque: Una falla o un bloqueo con captura se entiende sin tener que repetir la prueba.
  como: 'Windows: Win+Shift+S. Mac: Cmd+Shift+4. Android: encendido y bajar volumen. Pega con Ctrl+V en el paso
    o arrastra el archivo. Formatos jpeg, png, webp o pdf de hasta 5 MB.'
- id: datos-catalogo-de-componentes
  seccion: datos
  grupo: Panel
  titulo: El catálogo de componentes del panel de test
  resumen: Una página de revisión con todas las piezas del panel en claro y oscuro. No está en el menú.
  porque: Las pruebas del kit visual revisan botones, tablas y gráficos de ejemplo en un solo lugar, sin depender de los datos
    de un negocio. La página solo existe en test, y solo si el panel de test la tiene encendida.
  como: 'Con tu cuenta de tester ya dentro del panel de test, escribe en la barra de direcciones del navegador la dirección
    del panel seguida de /catalogo (test.solvershub.site/catalogo) y pulsa Enter. Si aparece «No encontrado» (404), el catálogo
    está apagado en test: marca la prueba como Bloqueada, anota «catálogo apagado» y avisa al dueño de la plataforma (se enciende
    con la configuración de test «Catálogo de componentes en el panel de test»).'
- id: datos-fallos-de-ejemplo
  seccion: datos
  grupo: Cuentas y negocio
  titulo: Un mensaje y un evento fallidos de ejemplo
  resumen: Un mensaje y un aviso de pago que fallaron a propósito en tu negocio de prueba, para revisar la bandeja de fallos.
  porque: La bandeja de fallos solo muestra algo cuando un mensaje o un evento agotó sus reintentos, y eso no pasa en un negocio
    sano. «Preparar mis datos» no los crea.
  como: 'Pídeselos al dueño de la plataforma antes de la prueba: Claude los deja en tu negocio de prueba en test. Para comprobar
    que están, entra con tu dueño de prueba a Cuenta › Configuración › Mensajes fallidos: si dice «Sin mensajes fallidos»
    y «Sin eventos fallidos», todavía no están; marca la prueba como Bloqueada y anota «sin fallos de ejemplo».'

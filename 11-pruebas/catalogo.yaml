- id: pruebas-qa-contrasenas-nuevas
  seccion: pruebas
  modulo: Plataforma
  entorno: panel
  area: Pruebas
  grupo: Centro de pruebas (SPEC-30)
  titulo: Pedir contraseñas nuevas para las cuentas de prueba
  contexto: 'Para qué sirve: si pierdes las contraseñas de tus cuentas de prueba, tú mismo pides otras desde tu cuenta de
    tester; las anteriores dejan de servir y se cierran sus sesiones (HU-QA-07).'
  prioridad: P1
  plataforma: panel
  precondiciones:
  - Tus datos de prueba ya preparados
  - Tu cuenta de tester en una ventana normal del navegador
  requiere:
  - datos-mis-datos-de-prueba
  - datos-cuenta-tester
  pasos:
  - accion: En una ventana privada (Ctrl+Shift+N en Chrome), entra al panel de test con tu dueño de prueba (su correo y su
      contraseña están en Plataforma › Pruebas › Datos de prueba). Ten a mano esa contraseña, sin pegarla en la nota.
    esperado: Entras al panel de tu negocio de prueba.
  - accion: En la ventana normal, con tu cuenta de tester, abre Plataforma › Pruebas › Datos de prueba y pulsa «Contraseñas
      nuevas» (arriba, junto a «Ir a mi negocio de prueba»).
    esperado: Aparece la confirmación «¿Generar contraseñas nuevas?», que avisa que las contraseñas actuales de tu dueño,
      gestor y colaborador de prueba dejan de servir y se cierran sus sesiones.
  - accion: Pulsa «Generar contraseñas nuevas».
    esperado: Aparece el aviso «Contraseñas nuevas generadas.» y cada cuenta muestra su contraseña nueva, con el aviso de
      copiarlas ahora porque no se vuelven a mostrar.
  - accion: En la ventana privada, recarga la página.
    esperado: La sesión del dueño se cerró y vuelves a la pantalla para entrar.
  - accion: Entra con la contraseña anterior y luego con la nueva.
    esperado: La anterior da error; la nueva entra.
  quien: Tester
  hu:
  - HU-QA-07

  modulo: Asistente y WhatsApp
  entorno: web
  area: Chat web
  grupo: Conversar con los agentes
  titulo: Contratar un plan y pagarlo
  contexto: 'Para qué sirve: comprobar que Ventas pide los datos una sola vez, muestra un único resumen, espera tu
    confirmación y solo entonces manda el link de pago.'
  prioridad: P1
  plataforma:
  - web
  - panel
  precondiciones:
  - Estar dentro del horario de atención del negocio (o sin horario configurado)
  - Pagos en línea activo en tu negocio de prueba con tus llaves de prueba de Wompi (ver la ficha de Wompi)
  requiere:
  - datos-wompi-sandbox
  - datos-negocio-con-agentes
  - datos-correo-alias
  - datos-negocio-ficticio
  pasos:
  - accion: Con tu dueño de prueba, abre Habilidades y mira «Pagos en línea». Si dice «No habilitada», pulsa
      «Configurar», carga tus llaves de prueba de Wompi con «Usar el ambiente de pruebas de Wompi» marcado y pulsa
      «Guardar y activar».
    esperado: Pagos en línea queda «Habilitada».
  - accion: En una ventana privada nueva, abre el chat web de tu negocio y escribe «Quiero contratar un plan».
    esperado: Te presenta el «Plan Asesoría mensual» de 150.000 COP al mes.
  - accion: Elige el Plan Asesoría mensual.
    esperado: Te pide en un solo mensaje, como lista numerada, los datos que necesita (por ejemplo nombre, documento,
      correo, celular).
  - accion: Responde todos los datos en un mismo mensaje, con datos inventados y tu correo con alias.
    esperado: 'Te muestra un solo resumen con el plan, el total y tus datos, y te pide confirmar. Todavía no manda ningún
      link.'
  - accion: Escribe «Sí, confirmo. Pasame el link de pago».
    esperado: Te manda un link de pago de Wompi por el total del resumen.
  - accion: Abre el link y paga con la tarjeta de prueba de Wompi.
    esperado: La página de Wompi muestra el pago aprobado.
  - accion: Vuelve al chat y escribe «Ya pagué».
    esperado: El asistente confirma que recibió el pago.
  - accion: Con tu dueño de prueba, ve a Comercio › Pedidos.
    esperado: Aparece el pedido del Plan Asesoría mensual, pagado, por 150.000 COP.

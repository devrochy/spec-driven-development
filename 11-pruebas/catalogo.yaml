  entorno: panel
  area: Agentes
  grupo: Agentes
  titulo: Cada conversación queda en el agente que la atendió
  contexto: 'Para qué sirve: comprobar que, después de conversar por el chat web, cada conversación aparece en el agente
    que respondió y no en los demás.'
  prioridad: P0
  plataforma:
  - panel
  - web
  precondiciones:

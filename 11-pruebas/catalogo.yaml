- id: pruebas-qa-ejecutar-una-prueba-paso-a-paso
  seccion: pruebas
  modulo: Plataforma
  entorno: panel
  area: Pruebas
  grupo: Centro de pruebas (SPEC-30)
  titulo: Ejecutar una prueba paso a paso
  contexto: 'Para qué sirve: comprobar que el centro de pruebas guarda cada paso al instante y no se pierde nada al recargar
    (HU-QA-03).'
  prioridad: P0
  plataforma: panel
  precondiciones:
  - Sesión de tester (o master) en el panel de test
  requiere:
  - datos-cuenta-tester
  pasos:
  - accion: Abre Plataforma › Pruebas, pestaña Ejecutar, y elige cualquier prueba de la lista de la izquierda.
    esperado: Ves sus pasos y el aviso «Estás viendo la prueba. Pulsa Empezar a probar arriba para marcar resultados.»
  - accion: Pulsa el botón «Empezar a probar» de arriba.
    esperado: En el paso 1 se habilitan los botones Aprobar, Falla, Bloqueado y Omitir, y arriba aparece «Mi avance».
  - accion: Pulsa el botón «Aprobar» del paso 1.
    esperado: El paso 1 queda Aprobado, arriba dice «Guardado» con la hora y se abre el paso 2.
  - accion: Recarga la página (F5) y vuelve a la misma prueba.
    esperado: El paso 1 sigue Aprobado y «Mi avance» no bajó.
  - accion: 'Atajos de teclado: haz clic en un espacio vacío de la página (no dentro de la nota) y pulsa la tecla O.'
    esperado: El paso 2 queda Omitido. Los atajos (A aprobar, F falla, B bloqueado, O omitir) solo funcionan después de «Empezar
      a probar» y mientras no estés escribiendo en la nota.

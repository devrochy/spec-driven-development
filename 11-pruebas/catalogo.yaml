  hu:
  - HU-DS-05
- id: pruebas-pausar-y-reactivar-el-asistente-desde-la-paleta
  seccion: pruebas
  modulo: Panel
  entorno: panel
  area: Navegación y sesión
  grupo: Panel · navegación y paleta (SPEC-29)
  titulo: Pausar y reactivar el asistente desde la paleta
  prioridad: P1
  plataforma: panel
  resumen: Confirmación con consecuencia
  pasos:
  - Ctrl+K → «pausar» → Enter.
  - Leer la confirmación y confirmar.
  - Ctrl+K → «reactivar».
  esperado: La confirmación explica que deja de responder; la barra superior muestra «Asistente pausado» y luego
    desaparece.
  quien: Dueño
  hu:
  - HU-DS-05
  - HU-UI-03
- id: pruebas-atajos-de-una-tecla-y-su-interruptor
  seccion: pruebas
  modulo: Panel
  entorno: panel
  area: Navegación y sesión
  grupo: Panel · navegación y paleta (SPEC-29)
  titulo: Atajos de una tecla y su interruptor
  prioridad: P2
  plataforma: panel
  resumen: g i, /, ?, [ y apagarlos
  pasos:
  - Pulsar g y luego i.
  - Pulsar ? y apagar «Atajos de una tecla».
  - Pulsar g y luego i otra vez; después Ctrl+K.
  esperado: Con atajos apagados g i no hace nada, pero Ctrl+K abre la paleta.
  quien: Dueño
  hu:
  - HU-DS-05

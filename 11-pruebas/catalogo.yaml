- id: pruebas-accesibilidad-teclado-nombres-y-movimiento
  seccion: pruebas
  modulo: Panel
  entorno: panel
  area: Seguridad y calidad
  grupo: Seguridad, accesibilidad y rendimiento
  titulo: Teclado, nombres accesibles y movimiento reducido
  contexto: 'Para qué sirve: comprobar que el panel se puede usar sin ratón y que respeta a quien pide menos animaciones en
    su equipo. Que cada botón tenga nombre para un lector de pantalla lo revisa una herramienta automática (axe) en el CI
    del panel: aquí no hace falta un lector.'
  prioridad: P2
  plataforma: panel
  requiere:
  - datos-mis-datos-de-prueba
  pasos:
  - accion: Con tu dueño de prueba, abre Cuenta › Equipo, deja el ratón quieto y recorre la página solo con la tecla Tab (Shift+Tab
      para volver atrás).
    esperado: Siempre ves un borde resaltado alrededor del elemento donde estás y nunca quedas atrapado en un lugar.
  - accion: Llega con Tab al botón «Nuevo colaborador», pulsa Enter y luego Escape.
    esperado: Se abre el diálogo con el cursor dentro; Escape lo cierra y el borde resaltado vuelve al botón.
  - accion: 'Pide menos animaciones en tu equipo. Windows: Configuración › Accesibilidad › Efectos visuales › apaga «Efectos
      de animación». Mac: Ajustes del Sistema › Accesibilidad › Pantalla › activa «Reducir movimiento». Recarga el panel y
      abre otra vez «Nuevo colaborador».'
    esperado: El diálogo aparece de golpe, sin deslizarse ni crecer. Al terminar, deja la opción como estaba.
  quien: Tester
  origen:
  - PLAN-DE-PRUEBAS:A11Y-02
  - PLAN-DE-PRUEBAS:A11Y-03
  - PLAN-DE-PRUEBAS:A11Y-04

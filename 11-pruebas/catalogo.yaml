- id: pruebas-panel-saltar-al-contenido-y-selector-con-teclado
  seccion: pruebas
  modulo: Panel
  entorno: panel
  area: Navegación y sesión
  grupo: Shell, navegación y ayuda
  titulo: Saltar al contenido y cambiar de negocio con el teclado
  contexto: 'El panel se puede usar sin ratón: el primer Tab ofrece saltar al contenido y el selector de negocio
    responde a flechas y Escape (HU-UI-03).'
  prioridad: P2
  plataforma: panel
  precondiciones:
  - Sesión iniciada en https://test.solvershub.site con una cuenta que tenga dos o más negocios
  datos:
  - Tu cuenta de tester (actúa como master)
  requiere:
  - datos-cuenta-tester
  pasos:
  - accion: Recargar cualquier página y pulsar Tab una vez.
    esperado: Aparece «Saltar al contenido» arriba a la izquierda.
  - accion: Pulsar Enter.
    esperado: El foco queda en el contenido de la página, no en el menú.
  - accion: Ir con Tab al selector de negocio de la barra superior y abrirlo con Enter.
    esperado: Se abre la lista de negocios con el actual marcado.
  - accion: Moverse con ↑ ↓ y cerrar con Escape.
    esperado: La lista se cierra sin cambiar de negocio y el foco vuelve al selector.
  quien: Tester
  hu:
  - HU-UI-03
- id: pruebas-panel-pagina-404-en-espanol
  seccion: pruebas
  modulo: Panel
  entorno: panel
  area: Navegación y sesión
  grupo: Shell, navegación y ayuda
  titulo: Página inexistente en español
  contexto: Una ruta que no existe muestra una página propia en español con salida al inicio (HU-UI-03).
  prioridad: P2
  plataforma: panel
  precondiciones:
  - Sesión iniciada en https://test.solvershub.site
  pasos:
  - accion: Abrir https://test.solvershub.site/esta-pagina-no-existe.
    esperado: Se ve una página en español que dice que no existe, con un enlace al inicio.
  - accion: Pulsar el enlace.
    esperado: Lleva al Resumen sin error.
  quien: Tester
  hu:
  - HU-UI-03
- id: pruebas-panel-esqueletos-mientras-carga
  seccion: pruebas
  modulo: Panel
  entorno: panel
  area: Navegación y sesión
  grupo: Shell, navegación y ayuda
  titulo: Esqueletos mientras carga una página
  contexto: Mientras una página espera al servidor se ven bloques grises con la forma del contenido, no una pantalla
    quieta ni un spinner (HU-UI-03, DESIGN.md).
  prioridad: P2
  plataforma: panel
  precondiciones:
  - Sesión iniciada en https://test.solvershub.site
  - 'En Chrome: DevTools › Network › Slow 3G (opcional, para verlo mejor)'
  pasos:
  - accion: Ir a Conversaciones desde el menú.
    esperado: Mientras carga, la tabla muestra filas grises con su forma.
  - accion: Esperar a que termine.
    esperado: Las filas grises se reemplazan por las conversaciones sin saltos bruscos.
  quien: Tester
  hu:
  - HU-UI-03
- id: pruebas-panel-barra-plegada-tooltips-y-menu-flotante
  seccion: pruebas
  modulo: Panel
  entorno: panel
  area: Navegación y sesión
  grupo: Shell, navegación y ayuda
  titulo: 'Barra lateral plegada: nombres y menús flotantes'
  contexto: Plegada, la barra lateral muestra solo íconos; cada ícono dice su nombre al pasar el puntero o el foco
    y un grupo con hijos abre un menú navegable con flechas (HU-DS-04).
  prioridad: P1
  plataforma: panel
  precondiciones:
  - Sesión iniciada en https://test.solvershub.site en una ventana de 1280 px o más
  - Barra lateral plegada (botón del pie o tecla [)
  datos:
  - Tu dueño de prueba (Pruebas › Datos de prueba)
  requiere:
  - datos-mis-datos-de-prueba
  pasos:
  - accion: Pasar el puntero por el ícono de Conversaciones.
    esperado: Aparece un tooltip con «Conversaciones».
  - accion: Llegar con Tab al ícono del grupo Cobranza.
    esperado: Al recibir el foco también muestra su nombre.
  - accion: Pulsar Enter sobre el grupo y moverse con ↓.
    esperado: Se abre un menú flotante con las secciones del grupo; las flechas lo recorren.
  - accion: Elegir Promesas.
    esperado: Llega a Cobranza › Promesas y el ícono del grupo queda marcado como activo (no solo por color).
  quien: Tester
  hu:
  - HU-DS-04
- id: pruebas-panel-barra-por-defecto-segun-ancho
  seccion: pruebas
  modulo: Panel
  entorno: panel
  area: Navegación y sesión
  grupo: Shell, navegación y ayuda
  titulo: Barra lateral según el ancho de la ventana
  contexto: Sin preferencia guardada, la barra se pliega entre 768 y 1279 px, se expande desde 1280 px y es un cajón
    en el celular (HU-DS-04).
  prioridad: P2
  plataforma: panel
  precondiciones:
  - Sesión iniciada en https://test.solvershub.site
  - Borrar la cookie panel_sidebar (DevTools › Application › Cookies) o usar una ventana privada
  pasos:
  - accion: Abrir el panel con la ventana a 1024 px de ancho.
    esperado: La barra arranca plegada (solo íconos).
  - accion: Ensanchar a 1440 px y recargar.
    esperado: La barra arranca expandida con los nombres.
  - accion: Pasar a 375 px (modo dispositivo de DevTools) y recargar.
    esperado: 'No hay barra: el menú es un cajón que se abre con el botón de la barra superior.'
  quien: Tester
  hu:
  - HU-DS-04

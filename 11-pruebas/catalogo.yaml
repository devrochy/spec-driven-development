- id: pruebas-spec31-app-buscar-negocio-y-inicio-sin-conexion
  seccion: pruebas
  modulo: App móvil
  entorno: apk
  area: Inicio y búsqueda
  grupo: Mejoras del ciclo (SPEC-31)
  titulo: Buscar un negocio e Inicio sin conexión en la app
  contexto: 'Para qué sirve: comprobar lo que faltó de la app en el ciclo: búsqueda en Negocios, precarga e Inicio sin conexión.'
  prioridad: P1
  plataforma: app

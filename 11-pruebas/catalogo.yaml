- id: pruebas-panel-catalogo-de-componentes
  seccion: pruebas
  modulo: Panel
  entorno: panel
  area: Kit visual
  grupo: Kit visual, temas y gráficos
  titulo: Catálogo vivo de componentes
  contexto: 'Para qué sirve: revisar de un vistazo que las piezas del panel (botones, etiquetas, formularios, tablas y gráficos)
    se ven bien en tema claro y oscuro. El catálogo no está en el menú: es una página de revisión que solo existe en test
    (HU-DS-03).'
  prioridad: P2
  plataforma: panel
  precondiciones:
  - El catálogo encendido en el panel de test (ver la ficha «El catálogo de componentes del panel de test»). Si la página
    dice que no existe, marca la prueba como Bloqueada y anota «catálogo apagado».
  requiere:
  - datos-catalogo-de-componentes
  pasos:
  - accion: Con tu cuenta de tester, abre el catálogo como dice la ficha.
    esperado: Se ve una página larga con botones, etiquetas, formularios, tablas, gráficos, barras de avance y pasos, cada
      uno dos veces, lado a lado, en claro y en oscuro.
  - accion: Baja hasta la tabla compacta y sigue bajando dentro de ella.
    esperado: Las filas son bajas, el encabezado de la tabla se queda fijo arriba y hay ejemplos de «cargando», «sin datos»
      y «error».
  - accion: En el gráfico de líneas con varias series, pulsa el nombre de una serie en la leyenda.
    esperado: Esa línea se oculta y las demás conservan su color.
  quien: Tester
  hu:
  - HU-DS-03
  - HU-DS-06
- id: pruebas-panel-grafico-ver-tabla-y-teclado
  seccion: pruebas
  modulo: Panel
  entorno: panel
  area: Kit visual
  grupo: Kit visual, temas y gráficos
  titulo: Gráfico con tabla alternativa y teclado
  contexto: 'Para qué sirve: comprobar que los datos de un gráfico también se pueden leer como tabla y recorrer con el teclado,
    para quien no puede ver el gráfico o no usa ratón (HU-DS-06).'
  prioridad: P2
  plataforma: panel
  precondiciones:
  - Haber conversado hoy por el chat web de tu negocio de prueba (por ejemplo, en «El saludo lo atiende el General»), para
    que el gráfico tenga datos. Sin conversaciones, la pestaña dice que todavía no hay consumo.
  requiere:
  - datos-mis-datos-de-prueba
  - datos-negocio-con-agentes

  contexto: 'Para qué sirve: comprobar que el dueño de un negocio solo ve y gestiona las cuentas de su negocio: no ve cuentas
    de la plataforma (master o tester) y no puede cambiar a otro propietario. Que la API rechace cambiar la contraseña o desactivar
    una cuenta de plataforma o compartida con otro negocio lo cubren los tests de la API y la prueba técnica «Otro negocio

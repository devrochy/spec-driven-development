      pulsa «Ver tabla».
    esperado: Aparece una tabla con los mismos días y valores que las barras, y el botón cambia a «Ocultar tabla».
  - accion: Pulsa «Ocultar tabla». Luego pulsa la tecla Tab hasta que el gráfico quede resaltado y mueve las flechas ← y →.
    esperado: Cada flecha resalta otra barra y muestra su fecha y su número de turnos.

  - accion: Desmarca el chat web y pulsa «Publicar versión».
    esperado: Aparece «Elige al menos una conexión donde instalar el agente.» y no aparece ningún «Versión … publicada».
  - accion: Ve a Conexiones.
    esperado: Cobranza no aparece entre los agentes del chat web.

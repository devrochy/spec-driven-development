      `X-Tenant-Id` del negocio SolversHub.
    esperado: 403, sin datos.
  - accion: Con la sesión del colaborador de solo lectura, intentar una escritura en `/api/v1/admin/leads`.
    esperado: '403.'
  - accion: Con la sesión del dueño de prueba, leer la configuración de una habilidad que tenga secretos (por ejemplo, Pagos
      en línea con llaves de Wompi sandbox).
    esperado: Los secretos salen redactados, nunca en claro.

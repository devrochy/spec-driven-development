- id: pruebas-agentes-crear-desde-plantilla
  seccion: pruebas
  modulo: Panel
  entorno: panel
  area: Agentes
  grupo: Crear y publicar agentes
  titulo: Crear un agente desde una plantilla
  contexto: 'Para qué sirve: comprobar que un dueño sin conocimientos técnicos arma un agente nuevo partiendo de una
    plantilla, paso a paso.'
  prioridad: P1
  plataforma: panel
  requiere:
  - datos-mis-datos-de-prueba
  - datos-negocio-con-agentes
  pasos:
  - accion: Con tu dueño de prueba, abre Agentes y pulsa «Nuevo agente».
    esperado: 'Aparecen cuatro plantillas: Agenda, Cobranza, Suscripciones y Ventas, cada una con sus superpoderes (lo que
      sabe hacer) y ejemplos de frases de clientes.'
  - accion: Mira la tarjeta de Suscripciones.
    esperado: Dice «Falta una habilidad» y su botón está apagado, porque tu negocio de prueba no tiene suscripciones.
  - accion: En la tarjeta de Cobranza (dice «Disponible») pulsa «Crear desde Cobranza», sin escribir nombre.
    esperado: 'Aparece el aviso «Agente «Cobranza» creado: ahora ajústalo y publícalo» y se abre «Editar Cobranza» con
      cinco pasos: Identidad, Proveedor y modelo, Superpoderes, Memoria y Publicar.'
  - accion: En Identidad, revisa el nombre y pulsa «Guardar y seguir».
    esperado: Aparece «Borrador guardado.» y pasa a Proveedor y modelo.
  - accion: En Proveedor y modelo, mira el modelo elegido y luego pulsa «Guardar y seguir».
    esperado: Antes de seguir se ve el costo estimado por cada 1.000 respuestas, o el texto de que aún no hay
      conversaciones para calcularlo.
  - accion: En Superpoderes, mira «Promesa de pago» y luego pulsa «Guardar y seguir» hasta llegar a Publicar.
    esperado: Está marcado, muestra las frases sugeridas de la habilidad y un contador como «5 frases (mínimo 3)» en
      verde. Memoria y Publicar se abren sin errores.
  quien: Tester
  hu:
  - HU-AOS-24
- id: pruebas-agentes-validaciones-del-editor
  seccion: pruebas
  modulo: Panel
  entorno: panel
  area: Agentes
  grupo: Crear y publicar agentes
  titulo: El editor avisa junto al campo lo que falta
  contexto: 'Para qué sirve: comprobar que, si algo falta en el agente, el editor lo dice en palabras claras al lado del
    campo y no deja seguir.'
  prioridad: P1
  plataforma: panel
  precondiciones:
  - El agente Cobranza creado en «Crear un agente desde una plantilla»
  requiere:
  - datos-mis-datos-de-prueba
  - datos-negocio-con-agentes
  pasos:
  - accion: Con tu dueño de prueba, abre Agentes › Cobranza y pulsa «Editar agente». En Identidad borra el nombre y pulsa
      «Guardar y seguir».
    esperado: Junto al nombre aparece «Ponle un nombre a tu agente.» y no pasa al paso siguiente. Vuelve a escribir el
      nombre y sigue.
  - accion: En Superpoderes, desmarca «Promesa de pago» y pulsa «Guardar y seguir».
    esperado: Aparece «Marca al menos un superpoder para este agente.» y no avanza.
  - accion: Vuelve a marcar «Promesa de pago». En «Tus frases» escribe una frase igual a una sugerida pero con otras
      mayúsculas o sin tildes (por ejemplo «TE PAGO EL VIERNES») y pulsa «Agregar frase».
    esperado: El contador de frases no sube, porque una frase repetida no cuenta como distinta.
  - accion: Agrega una frase nueva, por ejemplo «el lunes le abono la cuota».
    esperado: El contador sube en uno y sigue en verde.
  quien: Tester
  hu:
  - HU-AOS-24

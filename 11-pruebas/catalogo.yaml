  - accion: Pulsa la tarjeta de Ventas.
    esperado: 'Abre la página de Ventas con el camino «Agentes › Ventas» arriba, el texto «Especialista · Atiende en …» y
      cuatro pestañas: Conversaciones, Tareas, Clientes y registros, y Consumo y calidad.'
  - accion: Pulsa «Agentes» en el camino de arriba.
    esperado: Vuelve a la lista de agentes.

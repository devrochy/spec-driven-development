- id: pruebas-conexiones-pausa-whatsapp-qr-no-responde
  seccion: pruebas
  modulo: Panel
  entorno: panel
  area: Conexiones
  grupo: Consola de conexiones
  titulo: Pausar el WhatsApp por QR y comprobar que no responde
  contexto: 'Para qué sirve: comprobar que, al pausar una conexión desde Conexiones, el asistente deja de contestar por
    ese canal y solo por ese: los mensajes que entran se guardan, no sale nada (ni seguimientos ni recordatorios) y los
    demás canales del negocio, como el chat web, siguen atendiendo. Cada pausa queda en la auditoría del negocio (no se
    ve desde el panel).'
  prioridad: P0
  plataforma:
  - panel
  - whatsapp
  - web
  precondiciones:
  - Un número de WhatsApp vinculado por QR en tu negocio de prueba (ver la ficha «Un WhatsApp vinculado por QR y otro
    teléfono para escribirle»). Si en Conexiones no aparece la conexión de WhatsApp Web con su número vinculado, marca
    la prueba como Bloqueada y anota «QR sin vincular».
  - Otro teléfono con WhatsApp, distinto del vinculado, para escribirle como si fueras un cliente
  - Estar dentro del horario de atención del negocio (o sin horario configurado)
  requiere:
  - datos-mis-datos-de-prueba
  - datos-negocio-con-agentes
  - datos-whatsapp-qr
  pasos:
  - accion: Con tu dueño de prueba, abre Conexiones y busca la tarjeta de WhatsApp Web (la del número vinculado por QR).
    esperado: La tarjeta muestra el número vinculado, un estado distinto de «Pausada» y un botón «Pausar».
  - accion: Desde el otro teléfono, escribe «Hola» al número vinculado.
    esperado: El asistente responde. Así sabes que el canal funcionaba antes de pausarlo.
  - accion: En la tarjeta de WhatsApp Web, pulsa «Pausar».
    esperado: 'Se abre la confirmación «Pausar conexión», que dice que la conexión deja de responder, que lo que entre
      se guarda sin respuesta y que no sale nada por ella hasta que la reactives, y termina con la línea «Pausa solo
      este canal; los demás canales del negocio siguen atendiendo.»'
  - accion: Pulsa «Pausar» en la confirmación.
    esperado: Aparece el aviso «Conexión pausada.»; la tarjeta queda en «Pausada» y el botón cambia a «Reanudar».
  - accion: Desde el otro teléfono, escribe «¿Siguen atendiendo?» y espera dos minutos.
    esperado: No llega ninguna respuesta, ni siquiera el mensaje de fuera de horario.
  - accion: Con tu dueño de prueba, abre Conversaciones y busca la conversación del otro teléfono.
    esperado: El mensaje «¿Siguen atendiendo?» está guardado, sin respuesta del asistente.
  - accion: En una ventana privada nueva, abre el chat web de tu negocio (el enlace está en Plataforma › Pruebas › Datos
      de prueba) y escribe «Hola».
    esperado: El chat web responde con normalidad. La pausa es solo del WhatsApp por QR, no del negocio.
  - accion: Si no vas a correr enseguida «Reanudar el WhatsApp por QR…», vuelve a Conexiones y pulsa «Reanudar» en la
      tarjeta de WhatsApp Web.
    esperado: La conexión queda lista para la siguiente prueba (pausada) o reanudada.
  quien: Tester
  hu:
  - HU-AOS-23
- id: pruebas-conexiones-pausa-reanudar-vuelve-a-contestar
  seccion: pruebas
  modulo: Panel
  entorno: panel
  area: Conexiones
  grupo: Consola de conexiones
  titulo: Reanudar el WhatsApp por QR y comprobar que vuelve a contestar
  contexto: 'Para qué sirve: comprobar que una conexión pausada vuelve a atender en cuanto se reanuda, sin tener que
    vincularla otra vez.'
  prioridad: P1
  plataforma:
  - panel
  - whatsapp
  precondiciones:
  - Un número de WhatsApp vinculado por QR en tu negocio de prueba (ver la ficha «Un WhatsApp vinculado por QR y otro
    teléfono para escribirle»). Si no está vinculado, marca la prueba como Bloqueada y anota «QR sin vincular».
  - Otro teléfono con WhatsApp, distinto del vinculado
  - Estar dentro del horario de atención del negocio (o sin horario configurado)
  requiere:
  - datos-mis-datos-de-prueba
  - datos-negocio-con-agentes
  - datos-whatsapp-qr
  pasos:
  - accion: Con tu dueño de prueba, abre Conexiones y mira la tarjeta de WhatsApp Web. Si no dice «Pausada» (por
      ejemplo, porque no corriste la prueba anterior), pulsa «Pausar» y confirma.
    esperado: La tarjeta dice «Pausada» y tiene el botón «Reanudar».
  - accion: Pulsa «Reanudar».
    esperado: No pide confirmación. Aparece el aviso «Conexión reanudada.»; la tarjeta deja de decir «Pausada» y el
      botón vuelve a «Pausar».
  - accion: Desde el otro teléfono, escribe «Hola de nuevo» al número vinculado.
    esperado: El asistente responde.
  - accion: Con tu dueño de prueba, abre Conversaciones y busca esa conversación.
    esperado: Se ve «Hola de nuevo» con la respuesta del asistente. Lo que escribiste mientras estaba pausada sigue ahí,
      sin respuesta.

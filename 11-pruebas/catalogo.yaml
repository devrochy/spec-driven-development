  - accion: En el chat web pregunta «¿cuánto cuesta el parqueadero?».
    esperado: El agente responde con el dato del documento.
  - accion: Cambia la búsqueda a híbrida y repite la pregunta.
    esperado: El agente sigue respondiendo con el dato del documento.

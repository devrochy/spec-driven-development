  seccion: pruebas
  modulo: Panel
  entorno: panel
  area: Navegación y sesión
  grupo: Panel · navegación y paleta (SPEC-29)
  titulo: Buscar un cliente desde la paleta
  prioridad: P1
  plataforma: panel
  resumen: GET /search a los 250 ms, agrupado
  pasos:
  - Ctrl+K y escribir «Juana».
  - Esperar los resultados.
  esperado: Aparece «Juana Perez» en Clientes de cobranza; Enter abre su ficha.

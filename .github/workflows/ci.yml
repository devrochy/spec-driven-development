name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar PyYAML
        run: pip install pyyaml

      - name: Validar backlog, plantillas, enlaces y anclas
        run: python3 herramientas/regenerar.py --check
